name: Publicar versión revisada
on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: He revisado textos, archivos, imágenes y ausencia de datos identificables
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.inputs.reviewed == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Preparar alojamiento
        run: node scripts/ensure-project.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      - name: Publicar únicamente dist
        run: npx --yes wrangler@4.92.0 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch production --commit-message "Reviewed public release"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
