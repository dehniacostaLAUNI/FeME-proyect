name: Publicar versión revisada
on:
  workflow_dispatch:
    inputs:
      reviewed:
        description: He revisado textos, archivos, permisos de imagen y ausencia de datos sensibles
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.reviewed && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/configure-pages@v5
      - run: pnpm run build
        env:
          SITE_BASE: /FeME-proyect/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la versión revisada
        id: deployment
        uses: actions/deploy-pages@v4
